name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: python3 build.py

      # Explicit publish allowlist rather than uploading the whole repo — keeps build.py,
      # data/sources/, .venv/, and repo-management files off the deployed site.
      - name: Assemble publish directory
        run: |
          mkdir -p _publish
          cp index.html robots.txt _publish/
          cp -r assets _publish/
          mkdir -p _publish/data
          cp data/calls.js _publish/data/calls.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@v4
